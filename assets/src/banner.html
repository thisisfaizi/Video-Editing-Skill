<!doctype html>
<html><head><meta charset="utf-8">
<!-- Source for assets/banner.png. Render: ./scripts/render-assets.sh -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600&display=block" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:640px;overflow:hidden}
  body{background:radial-gradient(ellipse 90% 75% at 38% 40%,#1E1A16,#0C0B0A 72%);font-family:Inter,sans-serif;color:#EDE8DF;position:relative}
  .beam{position:absolute;left:-120px;top:-200px;width:900px;height:1100px;background:linear-gradient(115deg,rgba(255,236,210,.07),rgba(255,236,210,0) 55%);transform:rotate(-8deg);filter:blur(30px)}
  .leak{position:absolute;right:-180px;top:-160px;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(255,170,90,.16),transparent 65%)}
  .grain{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  .vig{position:absolute;inset:0;background:radial-gradient(ellipse 80% 70% at 50% 45%,transparent 55%,rgba(0,0,0,.55))}
  .copy{position:absolute;left:96px;top:100px;width:640px}
  .label{display:flex;align-items:center;gap:18px;font-size:13px;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:rgba(237,232,223,.6)}
  .label i{display:block;width:64px;height:1px;background:linear-gradient(90deg,transparent,rgba(205,179,138,.9))}
  h1{margin-top:30px;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:104px;line-height:.98;letter-spacing:-.01em}
  h1 em{font-style:italic;color:#CDB38A}
  p{margin-top:30px;font-size:21px;line-height:1.55;color:rgba(237,232,223,.66);font-weight:400;max-width:560px}
  .chips{position:absolute;left:96px;bottom:84px;display:flex;gap:12px}
  .chips span{font-size:13px;font-weight:500;letter-spacing:.08em;padding:9px 16px;border-radius:999px;border:1px solid rgba(237,232,223,.16);color:rgba(237,232,223,.75);background:rgba(255,255,255,.03)}
  /* phone */
  .phone{position:absolute;right:120px;top:64px;width:286px;height:512px;border-radius:44px;overflow:hidden;
    background:radial-gradient(ellipse 70% 45% at 50% 30%,#6B5446,#2A211C 60%,#15110E);
    box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.05)}
  .phone .glow{position:absolute;left:50%;top:150px;width:200px;height:220px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(217,160,174,.22),transparent 65%)}
  .head{filter:blur(1.5px);position:absolute;left:50%;top:108px;width:92px;height:116px;transform:translateX(-50%);border-radius:46px 46px 42px 42px;background:linear-gradient(180deg,#8C7262,#5E4A3F)}
  .body{filter:blur(1.5px);position:absolute;left:50%;top:218px;width:210px;height:300px;transform:translateX(-50%);border-radius:105px 105px 0 0;background:linear-gradient(180deg,#A7838A,#5E4650)}
  .island{position:absolute;left:50%;top:22px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:999px;
    background:linear-gradient(135deg,rgba(255,255,255,.26),rgba(255,255,255,.08) 45%,rgba(255,255,255,.14));backdrop-filter:blur(6px);
    box-shadow:inset 1.5px 1.5px 0 rgba(255,255,255,.55),0 8px 20px rgba(0,0,0,.25);font-size:12px;font-weight:600;color:#fff;white-space:nowrap}
  .island b{width:22px;height:22px;border-radius:7px;background:#CDB38A;display:grid;place-items:center;font-size:12px;color:#1A1714}
  .cap{position:absolute;left:0;right:0;top:300px;text-align:center;text-shadow:0 0 2px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.55),0 8px 28px rgba(0,0,0,.55)}
  .cap .s{font-family:Inter;font-weight:600;font-size:17px;color:#F5F2EC}
  .cap .h{font-family:'Cormorant Garamond';font-style:italic;font-weight:600;font-size:54px;line-height:1;color:#E7BCC6;margin-top:2px}
  .bar{position:absolute;left:22px;right:22px;bottom:22px;height:3px;border-radius:2px;background:rgba(255,255,255,.18)}
  .bar i{display:block;width:62%;height:100%;border-radius:2px;background:#F5F2EC}
  .shadow{position:absolute;right:150px;bottom:40px;width:230px;height:26px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.6),transparent 70%)}
</style></head>
<body>
  <div class="beam"></div><div class="leak"></div>
  <div class="copy">
    <div class="label">Claude Skill <i></i> House Style</div>
    <h1>Edit karo.<br><em>Get a film.</em></h1>
    <p>A premium short-form editing style for Claude: liquid-glass UI, outfit-matched colour and cinematic sound, rendered in Remotion.</p>
  </div>
  <div class="chips"><span>Remotion</span><span>Liquid glass</span><span>Cinematic SFX</span><span>Roman Urdu</span></div>
  <div class="shadow"></div>
  <div class="phone">
    <div class="glow"></div><div class="body"></div><div class="head"></div>
    <div class="island"><b>✓</b>Saved to your reels</div>
    <div class="cap"><div class="s">the one thing that</div><div class="s">changed my</div><div class="h">mornings</div></div>
    <div class="bar"><i></i></div>
  </div>
  <div class="vig"></div><div class="grain"></div>
</body></html>
